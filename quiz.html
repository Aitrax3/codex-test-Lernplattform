<!DOCTYPE html>
<html>
<head>
    <title>{{ topic }} Quiz</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
    <h1>{{ topic }} Quiz</h1>
    <p>Frage {{ index }} / {{ total }}</p>
    <p>{{ frage }}</p>
    <form method="post">
        <input type="text" name="answer" placeholder="Deine Antwort" required>
        <button type="submit">Absenden</button>
    </form>
</div>
</body>
</html>
