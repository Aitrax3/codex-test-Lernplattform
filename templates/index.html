<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmelden</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Theme wechseln"></button>
    <div class="login-shell">
        <section class="login-hero">
            <p class="hero-tagline">Eine Lernschleife nach der anderen.</p>
            <h1>Willkommen zurück</h1>
            <p class="hero-subtitle">Melde dich an und schließe deine nächste Lernschleife.</p>
        </section>
        <div class="login-card">
            <p class="muted accent-note">Sicher anmelden und direkt in deine nächste Lernschleife starten.</p>
            {% if message %}
                <div class="notification">{{ message }}</div>
            {% endif %}
            <form method="post" class="auth-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label class="visually-hidden" for="username">Benutzername</label>
                <input id="username" type="text" name="username" placeholder="Benutzername" required>
                <label class="visually-hidden" for="password">Passwort</label>
                <input id="password" type="password" name="password" placeholder="Passwort" required>
                <button class="primary-action" type="submit">Anmelden</button>
            </form>
            <div class="helper-links">
                <a href="{{ url_for('register') }}">Registrieren</a>
                <a href="{{ url_for('reset_request') }}">Passwort zurücksetzen</a>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            if (window.LoopwiseTheme && typeof window.LoopwiseTheme.init === "function") {
                window.LoopwiseTheme.init();
            }
        });
    </script>
    <script src="/static/theme.js" defer></script>
</body>
</html>
