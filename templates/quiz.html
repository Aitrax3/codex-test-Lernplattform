<!DOCTYPE html>
<html>
<head>
    <title>{{ topic }} Quiz</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
    <div class="sticker-wall">
        {% for sticker in stickers %}
            <span class="sticker-icon" style="--sticker-index:{{ loop.index0 }};">{{ sticker }}</span>
        {% endfor %}
    </div>
    <div class="card-body">
        <div class="nav-links">
            <a href="{{ url_for('choose_topic') }}">Themen</a>
            <a href="{{ url_for('shop') }}">Shop</a>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('leaderboard') }}">Rangliste</a>
            <a href="{{ url_for('review') }}">Review</a>
            <a href="{{ url_for('logout') }}">Abmelden</a>
        </div>
        <h1>{{ topic }} Quiz</h1>
        <p>Frage {{ index }} / {{ total }}</p>
        <p>{{ frage }}</p>
        <form method="post">
            <input type="text" name="answer" placeholder="Deine Antwort" required>
            <button type="submit">Absenden</button>
        </form>
    </div>
</div>
</body>
</html>
